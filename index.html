@media (max-width:800px){body{overflow:auto;height:auto}.mappa{display:none}.kb{flex:none;height:70vh}}
</style></head><body>
<div class="ph"><div><h1>Percorso</h1><p>Dal contatto che entra dai social fino all'impianto acceso. Ogni scheda va da sinistra a destra; sotto il nome, la prossima cosa da fare.</p></div><span class="agg" id="agg">aggiornato --:--</span></div>

<script>

var FP=[['documenti','Documenti','am'],['contratto','Contratto inviato','rd'],['firmato','Firmato','vi'],['acconto','Acconto','vi'],['sopralluogo','Sopralluogo','bl'],['progetto','Progetto studio','bl'],['merce','Merce e consegna','am'],['posa','Posa','gr'],['saldo','Saldo e DiCo','vi'],['connessione','Connessione','bl'],['attivo','Attivo','gr']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function eur(v){if(v==null||v==='')return '';return Math.round(Number(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €';}
function dt(t){if(!t)return '';var d=new Date(t);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);}

function tp(t){t=String(t||'').toLowerCase();if(t==='termico')return '<span class="tp" style="background:var(--rdw);color:var(--rd)">TERM</span>';if(t==='entrambi'||t==='fv+termico')return '<span class="tp" style="background:var(--viw);color:var(--vi)">FV+T</span>';if(t)return '<span class="tp" style="background:var(--amw);color:var(--am)">FV</span>';return '';}

/* ---- la prossima cosa da fare ---- */
function notaP(p){var g;
 switch(p.fase){
  case 'documenti': g=gg(p.creata); if(g>60) return ['ferma da '+g+' giorni · documenti '+p.ndoc+' di 4','rd']; return p.ndoc>=4?['documenti completi · contratto da generare','vi']:(p.ndoc>0?['documenti '+p.ndoc+' di 4','am']:['documenti da ricevere','am']);

  case 'posa': return fut(p.posa)?['posa '+dt(p.posa),'gr']:['posato '+dt(p.posa)+' · da chiudere','am'];
  case 'saldo': if(p.saldo) return p.dico?['saldo inviato · DiCo ok · connessione da presentare','bl']:['saldo inviato · DiCo mancante','rd']; return ['saldo da mandare'+(p.dico?'':' · DiCo mancante'),p.dico?'vi':'rd'];

 } return ['',''];}
function notaV(v){
 switch(v.fase){

  case 'scartato': return [v.motivo||String(v.stato||'scartato').replace(/_/g,' '),'ink3'];

 } return ['',''];}
/* ---- filtri ---- */
function okP(p){var q=Q.toLowerCase();if(TIPO!=='tutti'){var t=String(p.tipo||'').toLowerCase();if(TIPO==='fv'&&t==='termico')return false;if(TIPO==='te'&&t!=='termico'&&t!=='entrambi')return false;}
 if(VEND!=='tutti'&&String(p.venditore||'').toLowerCase().indexOf(VEND)<0)return false;
 return !q||[p.nome,p.comune,(p.ordini||[]).join(' ')].join(' ').toLowerCase().indexOf(q)>=0;}
function okV(v){var q=Q.toLowerCase();if(/^<test lead/i.test(String(v.nome||'')))return false;if(ORIG==='social'&&!social(v))return false;if(ORIG==='lista'&&social(v))return false;
 if(VEND!=='tutti'&&String(v.assegnato||'').toLowerCase().indexOf(VEND)<0)return false;
 return !q||[v.nome,v.comune,v.campagna].join(' ').toLowerCase().indexOf(q)>=0;}
/* ---- schede ---- */
function cartaP(p){var n=notaP(p);var luogo=[cap(p.comune)||'—',p.kwp?(String(p.kwp).replace('.',',')+' kWp'):''].filter(Boolean).join(' · ');
 return '<button class="mc'+(SEL==='p'+p.id?' sel':'')+'" data-p="'+esc(p.id)+'"><span class="nm">'+esc(p.nome||'(senza nome)')+'</span><span class="r2"><span class="c">'+esc(luogo)+'</span></span><span class="r2">'+tp(p.tipo)+'<span class="e">'+eur(p.eur)+'</span></span><span class="r3" style="color:var(--'+n[1]+')"><span class="dot" style="background:var(--'+n[1]+')"></span>'+esc(n[0])+'</span></button>';}

function disegna(){
 var V=D.vendita.filter(okV),P=D.pratiche.filter(okP);

  +'<input type="search" id="cerca" placeholder="Cerca nome, comune, ordine…" value="'+esc(Q)+'"></div>';
 h+='<div class="kb" id="kb">';
 if(VISTA!=='pratiche'){
